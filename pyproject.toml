[project]
name = "mensages-web"
version = "0.2.0"
description = "Editor web local (CRUD) de la base de datos SQLite de MensaGes, con Dash y AG Grid"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dash>=2.18.0",
    "dash-ag-grid>=33.0.0",
]

[project.scripts]
mensages-web = "mensages_web.cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
